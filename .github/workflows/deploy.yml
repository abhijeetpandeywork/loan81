name: Deploy Loan81 to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy_production:
    name: Deploy to Production (loan81.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 195.35.44.93
          port: 65002
          username: u878958741
          password: ${{ secrets.HOSTINGER_PROD_SSH_PASSWORD }}
          script: |
            cd /home/u878958741/domains/loan81.com/public_html
            rm -f default.php
            git config --global --add safe.directory /home/u878958741/domains/loan81.com/public_html
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/abhijeetpandeywork/loan81.git .
            fi
            chmod -R 755 .
            echo "Loan81 deployed to loan81.com successfully!"

  deploy_staging:
    name: Deploy to Staging (loft.digitalrubix.site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.23.184
          port: 65002
          username: u406313474
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            cd /home/u406313474/domains/loft.digitalrubix.site/public_html
            git config --global --add safe.directory /home/u406313474/domains/loft.digitalrubix.site/public_html
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/abhijeetpandeywork/loan81.git .
            fi
            chmod -R 755 .
            echo "Loan81 deployed to loft.digitalrubix.site successfully!"


